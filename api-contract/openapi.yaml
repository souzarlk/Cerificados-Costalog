openapi: 3.1.0
info:
  title: AGENTE COSTALOG API
  version: 1.0.0
  description: API REST independente do banco de dados, hospedada na infraestrutura da Costalog.
servers:
  - url: https://CHANGE-ME/api/v1
    description: Substituir pelo endereço HTTPS disponibilizado pela infraestrutura da empresa.
security:
  - CorporateBearer: []
paths:
  /health:
    get:
      security: []
      summary: Verifica a disponibilidade da API
      responses:
        "200":
          description: API operacional
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ok }
                  service: { type: string, example: agente-costalog-api }
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /admin/agent/sites:
    get:
      summary: Lista os domínios autorizados
      responses:
        "200":
          description: Lista e revisão atual
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteList"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      summary: Cadastra um hostname na allowlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteCreate"
      responses:
        "201":
          description: Site criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /admin/agent/sites/{siteId}:
    delete:
      summary: Remove um domínio da allowlist
      parameters:
        - name: siteId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Site removido }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/agent/devices:
    get:
      summary: Lista os computadores com agente instalado
      responses:
        "200":
          description: Inventário de dispositivos
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Device" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/agent/events:
    get:
      summary: Lista eventos de auditoria
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Eventos recentes
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AuditEvent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/agent/policy:
    get:
      summary: Consulta a revisão e o estado da política
      responses:
        "200":
          description: Política administrativa atual
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/agent/policy/publish:
    post:
      summary: Valida, versiona, assina e publica a política atual
      description: A API deve validar os hostnames, registrar auditoria, incrementar revisão e entregar política assinada aos agentes autorizados.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: Publicação realizada
          content:
            application/json:
              schema:
                type: object
                required: [revision, status, publishedAt]
                properties:
                  revision: { type: integer }
                  status: { type: string, const: published }
                  publishedAt: { type: string, format: date-time }
                  devicesPendingSync: { type: integer, minimum: 0 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
components:
  securitySchemes:
    CorporateBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token temporário emitido pelo provedor corporativo OIDC/OAuth2.
  schemas:
    SiteCreate:
      type: object
      required: [name, hostname, enabled]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 70 }
        hostname: { type: string, format: hostname, maxLength: 253 }
        enabled: { type: boolean }
    Site:
      allOf:
        - $ref: "#/components/schemas/SiteCreate"
        - type: object
          required: [id, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    SiteList:
      type: object
      required: [items, revision]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Site" }
        revision: { type: integer, minimum: 0 }
        updatedAt: { type: string, format: date-time }
    Device:
      type: object
      required: [id, deviceName, status]
      properties:
        id: { type: string, format: uuid }
        deviceName: { type: string }
        username: { type: string }
        status: { type: string, enum: [pending, active, disabled, revoked, offline] }
        installMode: { type: string, enum: [certificate, certificate-and-web] }
        policyRevision: { type: integer }
        lastSeenAt: { type: string, format: date-time }
    AuditEvent:
      type: object
      required: [id, eventType, createdAt]
      properties:
        id: { type: string, format: uuid }
        eventType: { type: string }
        title: { type: string }
        message: { type: string }
        deviceId: { type: string, format: uuid }
        deviceName: { type: string }
        domain: { type: string }
        createdAt: { type: string, format: date-time }
    Policy:
      type: object
      required: [revision, status, mode, allowedDestinations]
      properties:
        revision: { type: integer, minimum: 0 }
        status: { type: string, enum: [draft, published] }
        mode: { type: string, const: deny-by-default }
        defaultInstallMode: { type: string, enum: [certificate, certificate-and-web] }
        allowedDestinations:
          type: array
          items:
            type: object
            required: [hostname, enabled]
            properties:
              hostname: { type: string }
              enabled: { type: boolean }
        updatedAt: { type: string, format: date-time }
  responses:
    BadRequest:
      description: Dados inválidos
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Sessão ausente ou inválida
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Perfil administrativo necessário
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Registro não encontrado
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Conflito de cadastro ou revisão
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServiceUnavailable:
      description: API indisponível
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Error:
      type: object
      required: [error, message]
      properties:
        error: { type: string }
        message: { type: string }
        requestId: { type: string }
