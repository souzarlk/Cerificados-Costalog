openapi: 3.1.0
info:
  title: AGENTE COSTALOG API
  version: 1.0.0
  description: API para portal administrativo e agente Windows, hospedada na infraestrutura da Costalog.
servers:
  - url: https://CHANGE-ME/api/v1
    description: Substituir pelo endereço HTTPS real da API Costalog.
tags:
  - name: Health
  - name: Authentication
  - name: Administration
  - name: Windows Agent
paths:
  /health:
    get:
      tags: [Health]
      security: []
      summary: Verifica disponibilidade da API e do banco
      responses:
        "200":
          description: Serviço operacional
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ok }
                  service: { type: string, example: agente-costalog-api }
                  time: { type: string, format: date-time }
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /auth/login:
    post:
      tags: [Authentication]
      security: []
      summary: Autentica administrador do painel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 1, maxLength: 256 }
      responses:
        "200":
          description: Sessão administrativa criada
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, tokenType, expiresIn, user]
                properties:
                  accessToken: { type: string }
                  tokenType: { type: string, const: Bearer }
                  expiresIn: { type: string }
                  user:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      email: { type: string, format: email }
                      role: { type: string, enum: [admin, auditor] }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          description: Muitas tentativas de login

  /auth/me:
    get:
      tags: [Authentication]
      security:
        - AdminBearer: []
      summary: Retorna a identidade da sessão atual
      responses:
        "200":
          description: Administrador autenticado
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  email: { type: string, format: email }
                  role: { type: string, enum: [admin, auditor] }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/agent/sites:
    get:
      tags: [Administration]
      security:
        - AdminBearer: []
      summary: Lista hostnames cadastrados
      responses:
        "200":
          description: Sites e revisão
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteList"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Administration]
      security:
        - AdminBearer: []
      summary: Adiciona hostname à allowlist
      description: Requer perfil admin. Adicionar um hostname não publica automaticamente a política.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteCreate"
      responses:
        "201":
          description: Site criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/agent/sites/{siteId}:
    delete:
      tags: [Administration]
      security:
        - AdminBearer: []
      summary: Remove hostname da allowlist
      parameters:
        - name: siteId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Site removido }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/agent/devices:
    get:
      tags: [Administration]
      security:
        - AdminBearer: []
      summary: Lista computadores cadastrados
      responses:
        "200":
          description: Inventário de dispositivos
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Device" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/agent/devices/{deviceId}/status:
    patch:
      tags: [Administration]
      security:
        - AdminBearer: []
      summary: Ativa, desativa ou revoga dispositivo
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [active, disabled, revoked] }
      responses:
        "200":
          description: Estado atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/agent/events:
    get:
      tags: [Administration]
      security:
        - AdminBearer: []
      summary: Lista eventos de auditoria mais recentes
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Eventos registrados
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AuditEvent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/agent/policy:
    get:
      tags: [Administration]
      security:
        - AdminBearer: []
      summary: Consulta revisão atual da política administrativa
      responses:
        "200":
          description: Snapshot atual
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"

  /admin/agent/policy/publish:
    post:
      tags: [Administration]
      security:
        - AdminBearer: []
      summary: Publica nova revisão assinável
      description: Requer perfil admin. Incrementa a revisão, salva snapshot deny-by-default e grava auditoria. Os agentes recebem envelopes assinados individualmente ao consultar sua rota de política.
      responses:
        "200":
          description: Revisão publicada
          content:
            application/json:
              schema:
                type: object
                required: [revision, status, publishedAt]
                properties:
                  revision: { type: integer }
                  status: { type: string, const: published }
                  publishedAt: { type: string, format: date-time }
                  devicesPendingSync: { type: integer, minimum: 0 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/agent/enrollment-tokens:
    post:
      tags: [Administration]
      security:
        - AdminBearer: []
      summary: Gera código de instalação de uso único
      description: Requer perfil admin. O token é apresentado uma única vez e só seu hash é armazenado.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                expiresMinutes: { type: integer, minimum: 5, maximum: 1440, default: 60 }
      responses:
        "201":
          description: Código gerado
          content:
            application/json:
              schema:
                type: object
                required: [enrollmentToken, expiresInMinutes]
                properties:
                  enrollmentToken: { type: string }
                  expiresInMinutes: { type: integer }
                  warning: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /agent/enroll:
    post:
      tags: [Windows Agent]
      security: []
      summary: Registra computador com token de instalação
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enrollmentToken, deviceName, installMode]
              properties:
                enrollmentToken: { type: string }
                deviceName: { type: string, maxLength: 120 }
                windowsUsername: { type: string, maxLength: 120 }
                osVersion: { type: string, maxLength: 120 }
                agentVersion: { type: string, maxLength: 40 }
                installMode: { type: string, enum: [certificate, certificate-and-web] }
      responses:
        "201":
          description: Dispositivo cadastrado; token de dispositivo apresentado uma única vez
          content:
            application/json:
              schema:
                type: object
                required: [deviceId, deviceToken, installMode]
                properties:
                  deviceId: { type: string, format: uuid }
                  deviceToken: { type: string }
                  deviceName: { type: string }
                  installMode: { type: string }
                  warning: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /agent/heartbeat:
    post:
      tags: [Windows Agent]
      security:
        - DeviceBearer: []
      summary: Atualiza último contato e versão do agente
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                agentVersion: { type: string, maxLength: 40 }
      responses:
        "200":
          description: Heartbeat aceito
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  serverTime: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /agent/policy:
    get:
      tags: [Windows Agent]
      security:
        - DeviceBearer: []
      summary: Obtém política assinada específica do dispositivo
      responses:
        "200":
          description: Envelope RSA assinado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignedPolicyEnvelope"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /agent/events:
    post:
      tags: [Windows Agent]
      security:
        - DeviceBearer: []
      summary: Envia eventos de auditoria do dispositivo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventType]
              properties:
                eventType: { type: string, minLength: 2, maxLength: 80 }
                title: { type: string, maxLength: 120 }
                message: { type: string, maxLength: 1000 }
                domain: { type: string, maxLength: 253 }
                metadata: { type: object, additionalProperties: true }
      responses:
        "201":
          description: Evento registrado
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

components:
  securitySchemes:
    AdminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT curto retornado por POST /auth/login para administradores do portal.
    DeviceBearer:
      type: http
      scheme: bearer
      bearerFormat: Opaque
      description: Token exclusivo por computador, gerado no enrollment, armazenado no servidor somente como hash.
  schemas:
    SiteCreate:
      type: object
      additionalProperties: false
      required: [name, hostname, enabled]
      properties:
        name: { type: string, minLength: 1, maxLength: 70 }
        hostname: { type: string, maxLength: 253, description: Hostname DNS exato, sem protocolo, porta ou caminho }
        enabled: { type: boolean }
    Site:
      allOf:
        - $ref: "#/components/schemas/SiteCreate"
        - type: object
          required: [id, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    SiteList:
      type: object
      required: [items, revision]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Site" }
        revision: { type: integer, minimum: 0 }
    Device:
      type: object
      required: [id, deviceName, status]
      properties:
        id: { type: string, format: uuid }
        deviceName: { type: string }
        username: { type: string }
        status: { type: string, enum: [pending, active, disabled, revoked] }
        installMode: { type: string, enum: [certificate, certificate-and-web] }
        policyRevision: { type: integer }
        lastSeenAt: { type: string, format: date-time }
    AuditEvent:
      type: object
      required: [id, eventType, createdAt]
      properties:
        id: { type: string, format: uuid }
        eventType: { type: string }
        title: { type: string }
        message: { type: string }
        deviceId: { type: string, format: uuid }
        deviceName: { type: string }
        domain: { type: string }
        createdAt: { type: string, format: date-time }
    Policy:
      type: object
      required: [revision, status, mode]
      properties:
        revision: { type: integer, minimum: 0 }
        status: { type: string, enum: [draft, published] }
        mode: { type: string, const: deny-by-default }
        allowedDestinations:
          type: array
          items:
            type: object
            properties:
              hostname: { type: string }
              enabled: { type: boolean }
    SignedPolicyEnvelope:
      type: object
      required: [revision, status, keyId, signedPayload, signature]
      properties:
        revision: { type: integer }
        status: { type: string, const: published }
        keyId: { type: string }
        signedPayload: { type: string, format: byte }
        signature: { type: string, format: byte }
  responses:
    BadRequest:
      description: Dados inválidos
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Sessão ou credencial inválida
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Perfil sem permissão
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Registro não encontrado
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Registro duplicado ou conflito
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServiceUnavailable:
      description: API ou banco indisponível
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Error:
      type: object
      required: [error, message]
      properties:
        error: { type: string }
        message: { type: string }
        requestId: { type: string }
